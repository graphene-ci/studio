appId: ci.graphene.studio
productName: Graphene Studio
electronVersion: 41.1.0

# Publish straight to a real (non-draft) GitHub Release on a tag.
publish:
  provider: github
  releaseType: release

directories:
  output: dist_packaged

files:
  - dist/**/*
  - dist_electron/**/*
  - package.json

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  maintainer: Graphene CI <ci@graphene-ci.dev>
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
