name: release

# A pushed semver tag (X.Y.Z) builds the Graphene Studio desktop app for
# Linux (AppImage + deb) and Windows (nsis installer) and attaches the
# installers to the GitHub Release for the tag. Studio versions on its own
# cadence — independent of the server/agent.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: package:linux
          - os: windows-latest
            script: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate tag is semver
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vX.Y.Z; got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Enable corepack (pinned yarn from packageManager)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build and publish installers
        # electron-builder publishes the built installers (and the auto-update
        # metadata) to the GitHub Release for this tag itself — GH_TOKEN is what
        # turns its implicit tag-publish on.
        run: yarn ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
