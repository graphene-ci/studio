name: release

# A pushed semver tag (X.Y.Z) builds the Graphene Studio desktop app for
# Linux (AppImage + deb) and Windows (nsis installer) and attaches the
# installers to the GitHub Release for the tag. Studio versions on its own
# cadence — independent of the server/agent.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: package:linux
            glob: "dist_packaged/*.AppImage\ndist_packaged/*.deb"
          - os: windows-latest
            script: package:win
            glob: "dist_packaged/*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate tag is semver
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vX.Y.Z; got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Vendor the pinned yarn (package scripts call node bin/yarn.cjs)
        shell: bash
        run: |
          mkdir -p bin
          curl -fsSL https://github.com/yarnpkg/yarn/releases/download/v1.22.22/yarn-1.22.22.js -o bin/yarn.cjs
      - name: Install dependencies
        shell: bash
        run: node bin/yarn.cjs install --frozen-lockfile
      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build installers
        shell: bash
        run: node bin/yarn.cjs ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.glob }}
          fail_on_unmatched_files: true
